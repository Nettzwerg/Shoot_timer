; Timer-Firmware (Gerätesoftware). Board: ESP32-S3-DevKitC-1 mit mindestens 8 MB Flash.
; Gemeinsame Komponenten liegen in ../components (siehe CMakeLists.txt).

[env:esp32-s3-devkitc-1]
platform = espressif32@6.9.0
board = esp32-s3-devkitc-1
framework = espidf
monitor_speed = 115200
board_build.partitions = partitions.csv
