name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host-tests:
    name: Kern-Tests (PC)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tests für firmware/timer/src/core
        run: make -C firmware/timer/test

  python-tools:
    name: Python-Werkzeuge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyflakes
      - run: python -m pyflakes tools

  build-mess:
    name: Build Mess-Firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: ~/.platformio
          key: pio-${{ runner.os }}-${{ hashFiles('firmware/mess/platformio.ini') }}
      - run: pip install platformio
      - run: pio run -d firmware/mess
